name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CODEX_HOME: ${{ runner.temp }}/empty-codex
      XDG_CONFIG_HOME: ${{ runner.temp }}/cockpit-config
      XDG_DATA_HOME: ${{ runner.temp }}/cockpit-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate tag and run tests
        run: |
          version=$(python -c 'from codex_cockpit import __version__; print(__version__)')
          test "${GITHUB_REF_NAME#v}" = "$version"
          python -m unittest discover -s tests -v
      - name: Build packages
        run: |
          python -m pip install build
          python -m build
          ./packaging/smoke-wheel.sh
          ./packaging/build-deb.sh
          cd dist
          sha256sum *.whl *.tar.gz *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
  pypi:
    # Enable only after configuring the codex-cockpit Trusted Publisher on PyPI.
    if: vars.ENABLE_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Select Python distributions
        run: |
          mkdir python-dist
          cp dist/*.whl dist/*.tar.gz python-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/
