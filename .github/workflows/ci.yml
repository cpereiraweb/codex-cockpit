name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Isolate local application data
        run: |
          printf 'CODEX_HOME=%s/empty-codex\nXDG_CONFIG_HOME=%s/cockpit-config\nXDG_DATA_HOME=%s/cockpit-data\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test and compile
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q codex_cockpit
          bash -n install.sh packaging/build-deb.sh packaging/PKGBUILD
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Verify installed package outside checkout
        run: ./packaging/smoke-wheel.sh
      - name: Build and inspect Debian package
        run: |
          ./packaging/build-deb.sh
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: packages-python-${{ matrix.python }}
          path: dist/
